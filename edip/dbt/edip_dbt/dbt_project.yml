      +materialized: table
    marts_contract:
      +schema: marts_contract
      +materialized: table
    marts_finance:
      +schema: marts_finance
      +materialized: table
    marts_facility:
      +schema: marts_facility
      +materialized: table
    marts_spatial:
      +schema: marts_spatial
      +materialized: table
    marts_governance:
      +schema: marts_governance
