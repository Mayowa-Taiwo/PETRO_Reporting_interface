version: "3.9"

services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: edip
      POSTGRES_PASSWORD: edip_secret
      POSTGRES_DB: edip
    ports:
      - "5432:5432"
    volumes:
      - edip_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edip -d edip"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  init:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+asyncpg://edip:edip_secret@db:5432/edip
      DATABASE_URL_SYNC: postgresql://edip:edip_secret@db:5432/edip
      REDIS_URL: redis://redis:6379/0
      RUN_GENERATOR: "1"
      RUN_MIGRATIONS: "1"
      RUN_SEEDS: "1"
      RUN_DBT: "1"
      DDL_PATH: scripts/ddl/ppdm_lite11_postgres_ddl.sql
      DBT_TARGET_SCHEMA: marts_shared
    command: ["bash", "-lc", "scripts/init/entrypoint.sh"]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://edip:edip_secret@db:5432/edip
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-in-production
    ports:
      - "8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  edip_pgdata: {}
