[project]
name = "edip-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-jose[cryptography]",
    "bcrypt>=4.0",
    "redis>=5",
    "python-multipart",
]

[tool.uv]
dev-dependencies = ["pytest", "httpx", "pytest-asyncio"]
